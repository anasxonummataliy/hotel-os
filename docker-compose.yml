services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hotel-os-postgres
    environment:
      POSTGRES_DB: hotel_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hotel_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hotel-os-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend (barcha mikroservislar) ─────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-os-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/hotel_os
      SECRET_KEY: hotel-os-super-secret-jwt-key-change-in-production-2024
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      AUTH_SERVICE_PORT: 8000
      RECEPTION_SERVICE_PORT: 8001
      HOUSEKEEPING_SERVICE_PORT: 8002
      ROOM_SERVICE_PORT: 8003
      MAINTENANCE_SERVICE_PORT: 8004
      WEBSOCKET_GATEWAY_PORT: 8005
      DEBUG: "false"
      ENVIRONMENT: production
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
      - "8003:8003"
      - "8004:8004"
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        python -m alembic upgrade head &&
        python run_services.py
      "
    restart: unless-stopped

  # ── Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hotel-os-frontend
    ports:
      - "8012:8012"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
